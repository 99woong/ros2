gnss_corrector_node:
  ros__parameters:
    # ---- TF frame names ----
    frame_map:  map
    frame_odom: odom
    frame_body: body

    # ---- Topic names ----
    topic_lio:     /Odometry
    topic_fix:     /fix
    topic_heading: /heading

    # ---- Fixed harbour datum (map frame origin in WGS84) ----
    # set_origin 수행 전 초기 기동용 기본값.
    # 실제 운용 시 set_origin → datum.yaml 저장 → set_datum 으로 대체됨.
    # [시뮬레이션] Isaac Sim rtk_gnss_260622.py REF 좌표 (Port of Castellón, Spain)
    datum_lat: 39.9767
    datum_lon:  0.0233
    datum_yaw: 0.0          # map X축의 ENU 기준 방위각 [rad, CCW from East]

    # ---- GNSS initialisation stability thresholds ----
    gnss_init_samples:  10
    gnss_init_pos_std:  0.3
    gnss_init_yaw_std:  0.02

    # ---- Heading frame offset ----
    # yaw_enu = -yaw_raw + yaw_offset  (NED CW → ENU CCW 변환 + 안테나 장착 오프셋)
    # [시뮬레이션] rtk_gnss_260622.py가 NED 헤딩을 출력하므로 yaw_offset = π/2
    # [실제 센서] 실제 RTK 수신기 장착 오프셋에 맞게 조정 필요
    yaw_offset: 1.5708

    # ---- EKF process noise ----
    pos_process_noise: 0.001
    # [260706] yaw_process_noise 0.0001 → 0.000001 (100배 감소)
    # 변경사유: yaw_r=0.000003(측정노이즈)과 균형 필요
    #   Q_step = yaw_process_noise × dt_gps = 0.0001 × 0.05 = 5×10⁻⁶ > yaw_r=3×10⁻⁶
    #   → EKF가 프로세스 노이즈에 지배되어 GPS 헤딩 0.07° 노이즈가
    #     매 스텝 drift_yaw에 직접 반영 → Y 분산 악화 (16mm → 25mm)
    #   Q_step = 0.000001 × 0.05 = 5×10⁻⁸ << yaw_r=3×10⁻⁶ 로 측정 노이즈 지배
    #   → EKF가 GPS 헤딩을 장기 평균화 → drift_yaw 안정화
    # yaw_process_noise: 0.0001
    yaw_process_noise: 0.000001

    # ---- GPS measurement noise (R) by RTK quality ----
    # pos_r_fix:    0.5
    # pos_r_fix:    0.01
    pos_r_fix:    0.05
    pos_r_float:  5.0
    pos_r_single: 100.0
    # [260706] yaw_r 0.01 → 0.000003 (3000배 감소)
    # 변경사유: NAV680-AG 듀얼안테나 헤딩 정확도 스펙 반영
    #   스펙: 0.1°/1m baseline, 기선 2.908m → σ = 0.1°/2.908 = 0.034°, 보수적 0.1° 적용
    #   (0.1° × π/180)² = 3.0×10⁻⁶
    #   기존 0.01 rad²(σ=5.7°)은 스펙 대비 3000배 과대 → GPS 헤딩 사실상 무시
    #   → EKF yaw drift 미보정 → Y 분산 증가 (x_odom × σ_dyaw 구조)
    # yaw_r: 0.01
    yaw_r: 0.000003

    # ---- Safety: max drift correction per GPS update ----
    # max_pos_correction:        0.3
    max_pos_correction:        0.50
    max_pos_correction_resume: 0.15
    max_yaw_correction: 0.3
    max_heading_innovation: 0.3

    # ---- Chi-squared Mahalanobis innovation gate (2-DOF, 99% CI) ----
    # pos_innovation_gate: 9.21
    pos_innovation_gate: 80.0

    # ---- GNSS freeze / soft-resume ----
    gnss_freeze_count:  5
    gnss_recover_count: 3

    # ---- Quality thresholds ----
    # P(0,0)+P(1,1) < pos_converge_threshold → quality=5 (수렴 완료)
    pos_converge_threshold: 0.1
    # EKF 1회 보정량 >= relocalize_threshold → relocalization=true
    relocalize_threshold: 0.03

    # ---- LiDAR health ----
    # /Odometry 마지막 수신 후 이 시간 초과 시 DiagnosticStatus=ERROR
    lidar_timeout_s: 2.0

    # ---- State persistence paths ----
    datum_file_path: /tmp/lpc_datum.yaml
    state_file_path: /tmp/lpc_state.yaml

    # ---- Use NavSatFix.position_covariance when available ----
    use_rtk_covariance: false

    # ---- LIO restart detection threshold ----
    restart_gap_s: 3.0

    use_sim_time: true

    # ---- GPS antenna lever arm in body frame (x=forward, y=left) [m] ----
    #
    # [왜 Primary 안테나 기준인가]
    #   /fix 토픽은 rtk_gnss_260622.py에서 Primary 안테나의 월드 좌표를
    #   위경도로 변환하여 발행한다 (_latlon_from_world(p_pos[0], p_pos[1])).
    #   즉 /fix 위치 = Primary 안테나 위치이므로,
    #   EKF에 넣기 전 "Primary 안테나 → body(IMU)" 오프셋을 빼야
    #   Fast-LIO가 추적하는 body 위치와 일치하게 된다.
    #   Secondary 안테나는 헤딩(/heading) 계산에만 사용하므로 오프셋 무관.
    #
    # [오프셋 계산 방법]
    #   Step 1. base_link 프레임에서 벡터 = GNSS_Primary - IMU
    #   Step 2. body(IMU) 프레임으로 좌표 변환
    #           (IMU는 base_link 대비 Z축 -90° 회전:
    #            body_x=전방, body_y=좌방 / base_link_x=좌방, base_link_y=후방)
    #           변환 행렬 R^T = [[0,-1,0],[1,0,0],[0,0,1]]
    #   Step 3. body 프레임의 x, y 성분만 사용 (z는 수평 보정 불필요)
    #
    # [현재 USDA 실측값]
    #   IMU  위치 (base_link 기준): x=1.454, y=-7.26, z=0.5
    #   GNSS Primary (base_link 기준): x=1.454, y=-7.26, z=0.8
    #   base_link 벡터 = (0, 0, +0.3) → 수평 성분 0
    #   body 프레임 변환 후: offset_x=0.0, offset_y=0.0
    #   → 두 센서의 수평 위치가 동일하므로 레버암 보정 불필요
    #
    # [수정 예시: GNSS Primary가 (1.3, -8.0, 0.8)에 위치할 경우]
    #   base_link 벡터 = (1.3-1.454, -8.0-(-7.26), 0.3) = (-0.154, -0.74, 0.3)
    #   body 프레임 변환: R^T * (-0.154, -0.74, 0.3) = (0.74, -0.154, 0.3)
    #   → antenna_offset_x:  0.740   # 안테나가 IMU보다 전방 0.74m
    #   → antenna_offset_y: -0.154   # 안테나가 IMU보다 우측 0.154m
    antenna_offset_x: 0.0
    antenna_offset_y: 0.0

    # ---- Body → base_link offset (출력 기준점을 IMU → 차량 중심으로 보정) [m] ----
    #
    # [왜 base_link 오프셋이 필요한가]
    #   Fast-LIO /Odometry 는 body(IMU 센서) 프레임의 위치를 출력한다.
    #   NCU/제어계는 차량 중심(base_link)을 기준으로 경로 계획·제어를 하므로,
    #   IMU가 차량 중심에서 떨어져 있으면 헤딩 변화 시 위치 오차가 발생한다.
    #   이 오프셋을 적용하면 출력 좌표가 base_link(차량 중심) 기준이 된다.
    #
    # [오프셋 계산 방법]
    #   Step 1. USDA에서 base_link 프레임 기준 위치 읽기:
    #             IMU 위치 (base_link 기준):      (x_imu, y_imu, z_imu)
    #             base_link 원점 (base_link 기준): (0, 0, 0)
    #           base_link 프레임 기준 벡터 d_bl = (0,0,0) - (x_imu, y_imu, z_imu)
    #                                           = (-x_imu, -y_imu, -z_imu)
    #   Step 2. IMU는 base_link 대비 Z축 -90° 회전 → body 프레임으로 변환
    #           IMU orient: (w=0.7071, x=0, y=0, z=-0.7071) → Z축 -90° 회전
    #           body_x=전방, body_y=좌방 / base_link_x=좌방, base_link_y=후방
    #           변환 행렬 R^T (base_link→body):
    #             [ 0, -1,  0 ]   (body_x  = -base_link_y)
    #             [ 1,  0,  0 ]   (body_y  =  base_link_x)
    #             [ 0,  0,  1 ]   (body_z  =  base_link_z)
    #           d_body = R^T * d_bl
    #             body_x =  -d_bl_y
    #             body_y =   d_bl_x
    #             body_z =   d_bl_z
    #
    # [현재 USDA 실측값]
    #   IMU 위치 (base_link 기준): x=1.454, y=-7.26, z=0.5
    #   d_bl = (-1.454, 7.26, -0.5)
    #   d_body:
    #     body_x = -d_bl_y = -7.26
    #     body_y =  d_bl_x = -1.454
    #     body_z =  d_bl_z = -0.5
    #   → body_to_base_link_x: -7.26
    #   → body_to_base_link_y: -1.454
    #   → body_to_base_link_z: -0.5
    #
    # [수정 예시: IMU가 (2.0, -5.0, 0.6)에 위치할 경우]
    #   d_bl = (-2.0, 5.0, -0.6)
    #   d_body:
    #     body_x = -d_bl_y = -5.0
    #     body_y =  d_bl_x = -2.0
    #     body_z =  d_bl_z = -0.6
    #   → body_to_base_link_x: -5.0
    #   → body_to_base_link_y: -2.0
    #   → body_to_base_link_z: -0.6
    body_to_base_link_x: -7.26
    body_to_base_link_y: -1.454
    body_to_base_link_z: -0.5

    # ---- GPS noise simulation ----
    enable_noise_sim: false
    multipath_prob:       0.05
    multipath_magnitude:  8.0
    multipath_duration_s: 4.0
    shadow_prob:          0.03
    shadow_duration_s:    10.0
