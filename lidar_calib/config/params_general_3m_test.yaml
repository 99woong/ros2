lidar_calibration_node:
  ros__parameters:
    # ── 모드 ──────────────────────────────────────────────────────────────────
    lidar_mode: "general"

    # ── Topics / Frames ───────────────────────────────────────────────────────
    lidar1_topic: "/point_cloud"
    lidar2_topic: "/point_cloud2"
    lidar1_frame: "lidar_front"
    lidar2_frame: "lidar_rear"

    # ── Time sync ─────────────────────────────────────────────────────────────
    sync_slop_sec: 0.05

    # ── Preprocessing ─────────────────────────────────────────────────────────
    # 소규모 씬(~15m)이므로 voxel 0.1m 사용 가능 (기존 0.5m는 260m 씬 overflow 대응용)
    voxel_size:  0.1
    min_z:      -3.0    # Isaac Sim 센서 오프셋 고려 → 큐브 전체 포함
    max_z:       3.0    # 큐브 상단(+0.5m) + 여유
    min_range:   1.0
    max_range:  15.0    # 3m 간격 테스트 — 그 이상은 잡음 차단

    # ── Multi-yaw ICP 초기값 (cube_calibration 실패 fallback 전용) ─────────────
    # Kabsch SVD 정상 동작 시 이 값은 사용되지 않음.
    # LiDAR2가 LiDAR1 기준 +X 방향 3m 위치 가정.
    # 실제 Isaac Sim 세팅에 맞게 수정할 것.
    init_x:  10.3
    init_y:   0.38
    init_z:   0.0

    yaw_candidates: 8

    # ── ICP 파라미터 ──────────────────────────────────────────────────────────
    # Kabsch 결과가 정확하면 ICP는 소폭 정제만 하면 됨 → 좁은 대응 거리
    search_correspondence_distance: 2.0   # (기존 general: 3.0  /  15m 배치 기준)
    refine_correspondence_distance: 0.5   # (기존 general: 1.0)

    max_iterations:            100
    transformation_epsilon:    1.0e-8
    euclidean_fitness_epsilon: 1.0e-6
    fitness_score_threshold:   0.3       # 근거리 고품질 → 엄격하게 (기존: 0.5)

    # ── Sphere Calibration ─────────────────────────────────────────────────────
    sphere_radius:            0.5
    sphere_radius_tolerance:  0.1
    # 32ch LiDAR @12m: 수직 빔 간격 = 12×0.0253=0.30m → 0.4m OK
    # @15m: 0.38m → 0.4m 아슬아슬. 여유 확보를 위해 0.55m 사용
    sphere_cluster_tolerance: 0.55
    sphere_min_cluster_size:  10     # 15→10: 원거리 희박 클러스터 허용
    sphere_max_cluster_size:  3000
    # sphere_detection_voxel_size: 구 검출 전용 voxel 크기.
    #   0.02m 사용: 고유 위치만 보존 (unique pts) → 큰 구 클러스터 3000 pts 미만 유지.
    #   0.0 (no voxel): raw 누적으로 pts 폭발 → max_cluster_size 초과 거부 + 클러스터링 수초 소요.
    sphere_detection_voxel_size: 0.02

    # ── Cube Calibration ──────────────────────────────────────────────────────
    cube_size_xy:            1.0    # 큐브 수평 변 [m]
    cube_size_z:             1.0    # 큐브 높이 [m]  (1×1×1m 정육면체)
    cube_size_tolerance:     0.4    # bbox 허용 오차 [m]

    cube_cluster_tolerance:  0.55   # 클러스터링 거리 [m]
    #  ↑ 기존 general: 0.40 (차량 프레임 빔 차단 0.30m 간격 대응용)
    #    Isaac Sim LiDAR1이 빔 수가 적어 z_spacing ≈ 0.48m → 0.55m으로 링 간 병합 확보
    #    LiDAR1 센서 numChannels=32 확인 후 0.25m로 복원 권장

    cube_min_cluster_size:   10     # 최소 포인트 수 (근거리 → 충분히 많음)
    cube_max_cluster_size:   3000

    cube_plane_inlier_min:   0.45   # plane RANSAC 최소 inlier 비율
    #  ↑ 기존 general: 0.5  → LiDAR2 원거리 큐브B(8.5m)가 49%로 탈락하므로 0.45로 완화

    # ★ 핵심 변경: 5.0m → 2.0m
    # 기존 5.0m = 차체 오검출 방지용. 3m 간격 테스트에서 큐브가 3~8m 거리이므로
    # 이 값이 5.0m이면 큐브A(4.3m)·큐브B(6.3m)가 전부 '근거리 차체'로 거부됨.
    cube_min_distance:       2.0    # [m]  (AGV 운용 시: 5.0)

    # ── Panel Calibration ─────────────────────────────────────────────────────
    # 대형 평면 패널(1.5m × 1.5m) 3장 사용.
    #
    # ★ 배치 원칙: Ry(π) 퇴화 해 방지
    #   양쪽 LiDAR가 보는 패널 x좌표 집합이 서로 부호 반전 후에도 겹치지 않아야 함.
    #   LiDAR1(x=-8)이 보는 x집합 ≠ LiDAR2(x=+8)이 보는 x집합을 Ry(π)로 반전한 값
    #
    #   [잘못된 예] 패널 world x = {-2, 0, +2}  → L1={6,8,10}  L2-negated={6,8,10}  → 퇴화!
    #   [올바른 예] 패널 world x = {-5, 0, +2}  → L1={3,8,10}  L2-negated={6,8,13} → 정상
    #
    #              Y(전방)
    #              ↑
    #   ■ 패널C           ■ 패널B
    #  (-5, 6, 22)       (2, 6, 22)
    #
    #        ■ 패널A  (0, 6, 22)
    #
    # ← LiDAR_front(-8,0,20) ──────── LiDAR_rear(+8,0,20) →
    #
    panel_size:                 1.5
    panel_size_tolerance:       0.3
    panel_cluster_tolerance:    0.45
    panel_min_cluster_size:     10
    panel_max_cluster_size:     3000
    panel_plane_inlier_min:     0.65
    panel_min_distance:         3.0
    panel_detection_voxel_size: 0.05

    # ── Output ────────────────────────────────────────────────────────────────
    output_path: "/tmp/lidar_calib_3m_test.yaml"
