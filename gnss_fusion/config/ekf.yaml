ekf_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 1.5
    two_d_mode: false
    publish_tf: true
    publish_acceleration: false
    use_sim_time: true

    # 좌표 프레임 설정
    map_frame:       map
    odom_frame:      odom
    base_link_frame: body
    world_frame:     odom
    print_diagnostics: true


    # ============================================================
    # odom0: FAST-LIO2 /Odometry
    # ============================================================
    odom0: /Odometry
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  true,
      false, false, true,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 1.5

    # ============================================================
    # odom1: navsat_transform 변환 GPS odometry
    # ============================================================
    odom1: /odometry/gps
    odom1_config: [
      true,  true,  false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
    odom1_pose_rejection_threshold: 5.0
    
    # ============================================================
    # imu0: GPS Heading (/gps/imu)
    # ============================================================
    imu0: /gps/imu
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]

    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 10
    imu0_pose_rejection_threshold: 1.5

    # ============================================================
    # Process Noise Covariance (15x15)
