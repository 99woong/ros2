/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 1
        max_iteration: 3
        filter_size_surf: 0.2
        filter_size_map: 0.2
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./lidar2.pcd"

        common:
            lid_topic:  "/ouster2/points"
            imu_topic:  "/ouster2/imu"
            map_frame:  "camera_init_2"
            body_frame: "body_2"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 3
            scan_line: 32
            timestamp_unit: 3
            blind: 1.0

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.5
            b_acc_cov: 0.001
            b_gyr_cov: 0.001
            fov_degree:    360.0
            det_range:     150.0
            extrinsic_est_en:  false
            extrinsic_T: [ 0.0, 0.0, 0.0 ]
            extrinsic_R: [1., 0., 0.,
                        0., 1., 0.,
                        0., 0., 1.]

        publish:
            path_en:  false
            scan_publish_en:  true
            dense_publish_en: true
            scan_bodyframe_pub_en: true
            map_en: true

        pcd_save:
            pcd_save_en: true
            interval: -1
